[package]
name = "pathgen-macros"
version = "0.1.1"
edition = "2021"
rust-version = "1.78"
description = "Declaration-only derive and attribute macros for pathgen artifact contracts."
license = "MIT OR Apache-2.0"
repository = "https://github.com/jameshuntt/pathgen"
keywords = ["path", "derive", "artifact"]
categories = ["filesystem"]
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }

[dev-dependencies]
pathgen-core = { version = "0.1.1", path = "../pathgen-core" }
