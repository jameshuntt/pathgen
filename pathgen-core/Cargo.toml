[package]
name = "pathgen-core"
version = "0.1.2"
edition = "2021"
rust-version = "1.78"
description = "Dependency-light typed path, artifact endpoint, and operation descriptor core for pathgen."
license = "MIT OR Apache-2.0"
repository = "https://github.com/jameshuntt/pathgen"
keywords = ["path", "filesystem", "policy", "xdg", "config"]
categories = ["filesystem", "config"]
readme = "README.md"

[lib]
name = "pathgen_core"
path = "src/lib.rs"

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
